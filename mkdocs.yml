site_name: Liuaj's Wiki
site_description: 技术沉淀，持续精进
site_url: https://liu-aj.github.io/
use_directory_urls: true

# Font configuration with preconnect for performance
theme:
  name: material
  language: zh
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.breadcrumbs    # 面包屑导航
    - navigation.top            # 返回顶部按钮
    - navigation.path           # 显示当前路径
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.copy
    - content.illustrate        # 更好的图片展示
  palette:
    - scheme: default
      primary: deep orange
      accent: orange
      toggle:
        icon: material/brightness-7
        name: 切换夜间模式
    - scheme: slate
      primary: deep orange
      accent: orange
      toggle:
        icon: material/brightness-4
        name: 切换白天模式

plugins:
  - search
  - meta
  - tags:
      tags_structure: flat

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences
  - admonition
  - pymdownx.details
  - tables
  - attr_list
  - md_in_html
  - meta

nav:
  - 首页: index.md
  - ESP32系列:
      - esp32-matter-guide.md
      - esp32-family-2026.md
      - esp32-ssd1306-oled.md
      - esp32-motor-control-guide.md
      - esp32-ds18b20-home-assistant-guide.md
  - Home Assistant:
      - ha-dashboard-theme-2026.md
      - ha-ble-beacon-location.md
  - 3D打印:
      - bambu-a1-support-optimization.md
  - 智能家居:
      - zigbee2mqtt-guide-2026.md
  - AI开发:
      - AI开发/index.md
  - 数据库:
      - 数据库/index.md
  - 操作系统:
      - 操作系统/index.md
  - 工具软件:
      - 工具软件/index.md
  - 其他:
      - 其他/index.md
