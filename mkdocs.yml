site_name: Liuaj's Wiki
site_description: 技术沉淀，持续精进 | AI/ESP32/Home Assistant/3D打印
site_url: https://liu-aj.github.io/
site_author: Liuaj

theme:
  name: material
  language: zh
  custom_dir: overrides
  font:
    text: Roboto
    code: Roboto Mono
  icon:
    favicon: assets/images/favicon.svg
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.breadcrumbs
    - navigation.top
    - navigation.path
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.copy
    - content.illustrate
  palette:
    - scheme: default
      primary: deep orange
      accent: orange
      toggle:
        icon: material/brightness-7
        name: 切换夜间模式
    - scheme: slate
      primary: deep orange
      accent: orange
      toggle:
        icon: material/brightness-4
        name: 切换白天模式

plugins:
  - search
  - meta
  - tags:
      tags_structure: flat

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences
  - admonition
  - pymdownx.details
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

