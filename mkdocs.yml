site_name: Liuaj's Wiki
site_description: 技术沉淀，持续精进 | AI/ESP32/Home Assistant/3D打印
site_url: https://liu-aj.github.io/
site_author: Liuaj

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Liu-aj
  google_analytics:
    - G-XXXXXXXXXX
    - auto
  consent:
    title: Cookie 同意
    actions:
      - accept
      - reject
  sitemap:
    changefreq: weekly

theme:
  name: material
  language: zh
  custom_dir: overrides
  font:
    text: Roboto
    code: Roboto Mono
  icon:
    favicon: assets/images/favicon.svg
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.breadcrumbs
    - navigation.top
    - navigation.path
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.copy
    - content.illustrate
  palette:
    - scheme: default
      primary: deep orange
      accent: orange
      toggle:
        icon: material/brightness-7
        name: 切换夜间模式
    - scheme: slate
      primary: deep orange
      accent: orange
      toggle:
        icon: material/brightness-4
        name: 切换白天模式

plugins:
  - search
  - meta
  - tags:
      tags_structure: flat

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences
  - admonition
  - pymdownx.details
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - 首页: index.md
  - ESP32系列:
      - esp32-matter-guide.md
      - esp32-family-2026.md
      - esp32-ssd1306-oled.md
      - esp32-motor-control-guide.md
      - esp32-ds18b20-home-assistant-guide.md
  - Home Assistant:
      - ha-dashboard-theme-2026.md
      - ha-ble-beacon-location.md
  - 3D打印:
      - bambu-a1-support-optimization.md
  - 智能家居:
      - zigbee2mqtt-guide-2026.md
  - AI开发:
      - AI开发/index.md
  - 数据库:
      - 数据库/index.md
  - 操作系统:
      - 操作系统/index.md
  - 工具软件:
      - 工具软件/index.md
  - 其他:
      - 其他/index.md

copyright: © 2024-2026 Liuaj's Wiki | 使用 <a href="https://squidfunk.github.io/mkdocs-material/" target="_blank" rel="noopener">Material for MkDocs</a> 构建
