site_name: Liuaj's Wiki
site_description: 技术沉淀，持续精进
site_url: https://liu-aj.github.io/
use_directory_urls: true

theme:
  name: material
  language: zh
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.copy
  palette:
    - scheme: default
      primary: deep orange
      accent: orange
      toggle:
        icon: material/brightness-7
        name: 切换夜间模式
    - scheme: slate
      primary: deep orange
      accent: orange
      toggle:
        icon: material/brightness-4
        name: 切换白天模式

plugins:
  - search
  - blog

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences
  - admonition
  - pymdownx.details
  - tables
  - attr_list
  - md_in_html

nav:
  - 首页: index.md
  - ESP32系列:
      - esp32-matter-guide.md
      - esp32-family-2026.md
      - esp32-ssd1306-oled.md
      - esp32-motor-control-guide.md
      - esp32-ds18b20-home-assistant-guide.md
  - Home Assistant:
      - ha-dashboard-theme-2026.md
      - ha-ble-beacon-location.md
  - 3D打印:
      - bambu-a1-support-optimization.md
  - 智能家居:
      - zigbee2mqtt-guide-2026.md
  - 博客: blog/index.md
