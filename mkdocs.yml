site_name: Liuaj's Wiki
site_description: 技术沉淀，持续精进 | AI/ESP32/Home Assistant/3D打印
site_url: https://liu-aj.github.io/
site_author: Liuaj

theme:
  name: material
  language: zh
  custom_dir: overrides
  font:
    text: Roboto
    code: Roboto Mono
  icon:
    favicon: assets/images/favicon.svg
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.breadcrumbs
    - navigation.top
    - navigation.path
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.copy
    - content.illustrate
  palette:
    - scheme: default
      primary: deep orange
      accent: orange
      toggle:
        icon: material/brightness-7
        name: 切换夜间模式
    - scheme: slate
      primary: deep orange
      accent: orange
      toggle:
        icon: material/brightness-4
        name: 切换白天模式

plugins:
  - search
  - meta
  - tags

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences
  - admonition
  - pymdownx.details
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - index.md
  - 关于:
      - 关于: about/index.md
      - 自学清单: about/learn.md
      - 资源地址: about/resources.md
      - 我的书单: about/book.md
      - 打赏: donate.md
  - ESP32嵌入式:
      - 总览: ESP32嵌入式/ESP32-总览.md
      - Matter协议: ESP32嵌入式/esp32-matter-guide.md
      - 家族选型: ESP32嵌入式/esp32-family-2026.md
      - OLED显示: ESP32嵌入式/esp32-ssd1306-oled.md
      - 电机控制: ESP32嵌入式/esp32-motor-control-guide.md
      - DS18B20传感器: ESP32嵌入式/esp32-ds18b20-home-assistant-guide.md
  - 智能家居:
      - 总览: 智能家居/智能家居-总览.md
      - HA仪表盘: 智能家居/ha-dashboard-theme-2026.md
      - 蓝牙定位: 智能家居/ha-ble-beacon-location.md
      - Zigbee2MQTT: 智能家居/zigbee2mqtt-guide-2026.md
      - 拓竹A1: 智能家居/bambu-a1-support-optimization.md
  - AI应用开发:
      - 总览: AI应用开发/AI应用-总览.md
      - Agent框架: AI应用开发/AI-Agent-Production-Framework.md
