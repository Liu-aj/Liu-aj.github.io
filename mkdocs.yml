site_name: Liuaj's Wiki
site_description: 技术沉淀，持续精进 | AI/ESP32/Home Assistant/3D打印
site_url: https://liu-aj.github.io/
site_author: Liuaj

theme:
  name: material
  language: zh
  custom_dir: overrides
  font:
    text: Roboto
    code: Roboto Mono
  icon:
    favicon: assets/images/favicon.svg
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.breadcrumbs
    - navigation.top
    - navigation.path
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.copy
    - content.illustrate
  palette:
    - scheme: default
      primary: deep orange
      accent: orange
      toggle:
        icon: material/brightness-7
        name: 切换夜间模式
    - scheme: slate
      primary: deep orange
      accent: orange
      toggle:
        icon: material/brightness-4
        name: 切换白天模式

plugins:
  - search
  - meta
  - tags:
      tags_structure: flat

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences
  - admonition
  - pymdownx.details
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - index.md
  - 关于:
      - 关于: about/index.md
      - 自学清单: about/learn.md
      - 资源地址: about/resources.md
      - 我的书单: about/book.md
      - 打赏: donate.md
  - ESP32嵌入式: ESP32嵌入式/ESP32-总览.md
  - 智能家居: 智能家居/智能家居-总览.md
  - AI应用开发: AI应用开发/AI应用-总览.md
  - 后端工程: 后端工程/研发基础/architecture.md
  - 效率工具: 效率工具/开发工具/cli-tools.md

copyright: © 2024-2026 Liuaj's Wiki | 使用 <a href="https://squidfunk.github.io/mkdocs-material/" target="_blank" rel="noopener">Material for MkDocs</a> 构建