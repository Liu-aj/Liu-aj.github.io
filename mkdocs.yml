site_name: Liuaj's Wiki
site_description: 技术沉淀，持续精进 | AI/ESP32/Home Assistant/3D打印
site_url: https://liu-aj.github.io/
site_author: Liuaj

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Liu-aj
  google_analytics:
    - G-XXXXXXXXXX
    - auto
  consent:
    title: Cookie 同意
    actions:
      - accept
      - reject
  sitemap:
    changefreq: weekly
  announcement:
    - icon: "🎉"
      content: "欢迎访问 Liuaj's Wiki，如有问题请提交 Issue"

theme:
  name: material
  language: zh
  custom_dir: overrides
  font:
    text: Roboto
    code: Roboto Mono
  icon:
    favicon: assets/images/favicon.svg
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.breadcrumbs
    - navigation.top
    - navigation.path
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.copy
    - content.illustrate
  palette:
    - scheme: default
      primary: deep orange
      accent: orange
      toggle:
        icon: material/brightness-7
        name: 切换夜间模式
    - scheme: slate
      primary: deep orange
      accent: orange
      toggle:
        icon: material/brightness-4
        name: 切换白天模式

plugins:
  - search
  - meta
  - tags:
      tags_structure: flat

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences
  - admonition
  - pymdownx.details
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

