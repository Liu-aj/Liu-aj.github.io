name: PR Preview Deploy

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-pr-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt -q

      - name: Build preview site
        run: mkdocs build --site-dir preview

      - name: Upload preview artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: preview

      - name: Deploy preview
        uses: actions/deploy-pages@v4
        with:
          artifact_name: preview
          token: ${{ secrets.GITHUB_TOKEN }}
          deployment_id: ${{ github.run_id }}-${{ github.run_attempt }}

      - name: Comment preview URL
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const url = `https://deploy-preview-${{ github.event.number }}-liu-aj.github.io/`;
            github.rest.issues.createComment({
              issue_number: ${{ github.event.number }},
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `📖 Preview deployed to: ${url}`
            });
